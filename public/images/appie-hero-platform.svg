<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="100%" height="100%" style="background: transparent;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#18181b" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb200"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Elements -->
  <circle cx="280" cy="180" r="160" fill="#0d9488" opacity="0.12" filter="url(#subtleGlow)"/>
  <circle cx="920" cy="220" r="180" fill="#06b6d4" opacity="0.1" filter="url(#subtleGlow)"/>
  <circle cx="600" cy="480" r="140" fill="#ffb200" opacity="0.08" filter="url(#subtleGlow)"/>

  <!-- Main Hero Device Container Mockup -->
  <rect x="80" y="40" width="1040" height="560" rx="24" fill="url(#bgGlow)" stroke="#3f3f46" stroke-width="2"/>

  <!-- Top Window Header / Telemetry Bar -->
  <rect x="80" y="40" width="1040" height="52" rx="24" fill="#27272a" opacity="0.7"/>
  <circle cx="120" cy="66" r="6" fill="#ef4444"/>
  <circle cx="142" cy="66" r="6" fill="#f59e0b"/>
  <circle cx="164" cy="66" r="6" fill="#10b981"/>
  
  <rect x="360" y="52" width="480" height="28" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="600" y="70" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    🔒 https://appie.health/care-journey • End-to-End Triage &amp; Clinical Dispatch
  </text>

  <!-- Left Card: AI Symptom Intake & Real-time Analysis -->
  <g transform="translate(120, 120)">
    <rect width="300" height="440" rx="16" fill="url(#cardBg)" stroke="#3f3f46" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#0d9488" opacity="0.2"/>
    <path d="M38 34 L38 50 M30 42 L46 42" stroke="#0d9488" stroke-width="3" stroke-linecap="round"/>
    <text x="68" y="38" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">AI Symptom Evaluation</text>
    <text x="68" y="54" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Clinical Evidence Scoring</text>

    <!-- Pulse ECG Waveform -->
    <path d="M20 110 L80 110 L95 85 L110 135 L125 95 L140 120 L155 110 L280 110" fill="none" stroke="url(#tealGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Symptom Pill tags -->
    <g transform="translate(20, 140)">
      <rect width="110" height="28" rx="14" fill="#18181b" stroke="#0d9488" stroke-width="1"/>
      <text x="55" y="18" fill="#14b8a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Dry Cough • Lvl 3</text>

      <rect x="120" width="130" height="28" rx="14" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
      <text x="185" y="18" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Fever (101°F) • Lvl 4</text>
    </g>

    <!-- Severity Indicator Bar -->
    <rect x="20" y="190" width="260" height="70" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="36" y="214" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Calculated Urgency Level</text>
    <text x="210" y="214" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">ROUTINE</text>
    <rect x="36" y="230" width="228" height="8" rx="4" fill="#27272a"/>
    <rect x="36" y="230" width="140" height="8" rx="4" fill="url(#tealGrad)"/>

    <!-- Recommendations -->
    <rect x="20" y="278" width="260" height="130" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="36" y="304" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-transform="uppercase">Recommended Next Step</text>
    <text x="36" y="328" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Tele-Consult General Physician</text>
    <text x="36" y="348" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Dr. Ananya Sharma • Available in 10 mins</text>
    
    <rect x="36" y="365" width="228" height="30" rx="6" fill="#0d9488"/>
    <text x="150" y="384" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Connect With Clinician</text>
  </g>

  <!-- Center Card: Telemedicine Consultation & Review -->
  <g transform="translate(450, 120)">
    <rect width="300" height="440" rx="16" fill="url(#cardBg)" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Doctor badge -->
    <rect x="20" y="24" width="48" height="48" rx="24" fill="#1e293b" stroke="#0d9488" stroke-width="2"/>
    <text x="44" y="54" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" text-anchor="middle">👨‍⚕️</text>
    
    <text x="80" y="44" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700">Dr. Ananya Sharma</text>
    <text x="80" y="60" fill="#14b8a6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">MBBS, MD • Reg #KMC-48291</text>

    <!-- Video Feed Placeholder Graphic -->
    <rect x="20" y="88" width="260" height="150" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="150" cy="150" r="28" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <path d="M144 140 L162 150 L144 160 Z" fill="#06b6d4"/>
    
    <rect x="32" y="100" width="84" height="20" rx="4" fill="#000000" opacity="0.6"/>
    <circle cx="42" cy="110" r="4" fill="#10b981"/>
    <text x="52" y="114" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">LIVE CONSULT</text>

    <!-- Diagnosis & Review Gate -->
    <rect x="20" y="254" width="260" height="85" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="36" y="278" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">MANDATORY CLINICAL GATE</text>
    <text x="36" y="298" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Diagnosis: Acute Bronchitis (Mild)</text>
    <text x="36" y="318" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">✓ AI assessment verified by doctor</text>

    <!-- Digital Signature Badge -->
    <rect x="20" y="352" width="260" height="56" rx="10" fill="#18181b" stroke="#0d9488" stroke-width="1"/>
    <text x="36" y="375" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Cryptographically Signed Rx</text>
    <text x="36" y="393" fill="#a1a1aa" font-family="monospace" font-size="10">SIG: 7f8a9e...e829 (Valid Telehealth)</text>
  </g>

  <!-- Right Card: Instant Fulfillment & Doorstep Delivery -->
  <g transform="translate(780, 120)">
    <rect width="300" height="440" rx="16" fill="url(#cardBg)" stroke="#3f3f46" stroke-width="1.5"/>

    <!-- Header -->
    <rect x="20" y="24" width="36" height="36" rx="10" fill="#f59e0b" opacity="0.2"/>
    <text x="38" y="48" fill="#ffb200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" text-anchor="middle">📦</text>
    <text x="68" y="38" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Pharmacy &amp; Logistics</text>
    <text x="68" y="54" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">MedPlus Indiranagar Hub</text>

    <!-- Prescribed Items Box -->
    <rect x="20" y="80" width="260" height="110" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="36" y="104" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Dispatched Prescriptions (2 items)</text>
    
    <text x="36" y="130" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">• Dolo 650mg (10 tabs) — Verified</text>
    <text x="36" y="150" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">• Cetzine 10mg (10 tabs) — Verified</text>
    <text x="36" y="172" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">✓ Batch scanned &amp; seal-checked</text>

    <!-- Live Transit Mini Map -->
    <rect x="20" y="206" width="260" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Simulated Map Grid & Route -->
    <path d="M40 240 L100 240 L100 290 L220 290 L220 270" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M40 240 L100 240 L100 290 L160 290" fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Pharmacy Origin Pin -->
    <circle cx="40" cy="240" r="7" fill="#10b981"/>
    <!-- Courier Live Beacon -->
    <circle cx="160" cy="290" r="10" fill="#ffb200" opacity="0.3"/>
    <circle cx="160" cy="290" r="6" fill="#ffb200"/>
    <!-- Destination Pin -->
    <circle cx="220" cy="270" r="7" fill="#ef4444"/>

    <text x="36" y="324" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">ETA: 14 mins • Swift Courier Rider Arun</text>

    <!-- Completed Status Footer -->
    <rect x="20" y="352" width="260" height="56" rx="10" fill="#18181b" stroke="#10b981" stroke-width="1"/>
    <text x="36" y="375" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">Closed-Loop Care Delivered</text>
    <text x="36" y="393" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">From Symptom to Doorstep in 45 Mins</text>
  </g>
</svg>
